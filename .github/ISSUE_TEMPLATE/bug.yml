name: Bug
description: Something behaves differently from what it should.
title: '<Imperative fix, for example: Fix the missing welcome text on mobile>'
type: Bug
assignees: ['Adnan-13']
body:
  - type: textarea
    id: actual
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Branch or version, browser or client, operating system.
