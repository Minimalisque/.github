name: Feature
description: A user-visible capability, or the parent issue of a Planning work.
title: '<Imperative outcome, for example: Add the welcome endpoint>'
type: Feature
assignees: ['Adnan-13']
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this exists; link the Planning folder on the project branch.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        - In scope:
        - Out of scope:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable outcomes.
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: planning
    attributes:
      label: Planning
      placeholder: 'Minimalisque-AI-DLC, branch <project>, aidlc-docs/planning/<work-name>/'
